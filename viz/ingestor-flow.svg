<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1060" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="#888"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="#059669"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>


  </defs>

  <rect width="680" height="1060" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">ingestor — Data Flow</text>
  <text x="340" y="50" text-anchor="middle" font-size="11" fill="#64748b">Kafka → franz-go → Processor → NATS JetStream</text>

<g transform="translate(-420, 0)">

  <!-- External: Kafka -->
  <rect x="468" y="74" width="200" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="568" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Kafka Topic</text>
  <text x="568" y="110" text-anchor="middle" font-size="10" fill="#64748b">source of events</text>

  <line x1="568" y1="122" x2="568" y2="148" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Consumer -->
  <rect x="468" y="150" width="200" height="56" rx="6" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="568" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">kafka.Consumer</text>
  <text x="568" y="186" text-anchor="middle" font-size="10" fill="#475569">consumeLoop → PollFetches</text>
  <text x="568" y="198" text-anchor="middle" font-size="10" fill="#64748b">internal/kafka/consumer.go</text>

  <line x1="568" y1="206" x2="568" y2="232" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Processor -->
  <rect x="468" y="234" width="200" height="72" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="568" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">KafkaMsgProcessor</text>
  <text x="568" y="270" text-anchor="middle" font-size="10" fill="#475569">ProcessBatch(ctx, []*kgo.Record)</text>
  <text x="568" y="286" text-anchor="middle" font-size="10" fill="#64748b">internal/ingestor/processor.go</text>

  <!-- Branch: sync vs async -->
  <line x1="568" y1="306" x2="568" y2="326" stroke="#888" stroke-width="1.5"/>
  <line x1="568" y1="326" x2="490" y2="326" stroke="#888" stroke-width="1"/>
  <line x1="568" y1="326" x2="646" y2="326" stroke="#888" stroke-width="1"/>
  <line x1="490" y1="326" x2="490" y2="348" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="646" y1="326" x2="646" y2="348" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="490" y="322" text-anchor="middle" font-size="10" fill="#ef4444">dead (const = AsyncMode)</text>
  <text x="646" y="322" text-anchor="middle" font-size="10" fill="#64748b">default</text>

  <!-- Sync path (dead code — DefaultProcessorMode is const AsyncMode) -->
  <rect x="420" y="350" width="140" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="490" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">processBatchSync</text>
  <text x="490" y="386" text-anchor="middle" font-size="10" fill="#b91c1c">unreachable</text>

  <!-- Async path -->
  <rect x="576" y="350" width="140" height="48" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="646" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">processBatchAsync</text>
  <text x="646" y="386" text-anchor="middle" font-size="10" fill="#64748b">retry loop w/ backpressure</text>

  <line x1="646" y1="398" x2="646" y2="424" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Async loop sub-steps -->
  <rect x="460" y="426" width="372" height="156" rx="6" fill="#f8fafc" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="444" font-size="11" font-weight="bold" fill="#475569">Async Retry Loop (per batch iteration)</text>

  <!-- step 1 -->
  <rect x="476" y="456" width="340" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="484" y="471" font-size="10" fill="#1d4ed8">1. publishBackpressureSlice  → retry prior carry</text>

  <!-- step 2 -->
  <rect x="476" y="484" width="340" height="22" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="484" y="499" font-size="10" fill="#166534">2. publishFromCursor  → prepareMessage per record</text>

  <!-- step 3 -->
  <rect x="476" y="512" width="340" height="22" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="484" y="527" font-size="10" fill="#991b1b">3. WaitForAsyncPublishAcks → classifyFutures</text>

  <!-- step 4 -->
  <rect x="476" y="540" width="340" height="22" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="484" y="555" font-size="10" fill="#5b21b6">4. advanceLastAckedIdx → check termination</text>

  <line x1="646" y1="582" x2="646" y2="596" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="656" y="592" font-size="9" fill="#64748b">step 2 expand</text>

  <!-- ============================================================ -->
  <!-- Schema Validation Detail (NEW) -->
  <!-- ============================================================ -->
  <rect x="460" y="596" width="372" height="134" rx="6" fill="#fff" stroke="#84cc16" stroke-width="1.5"/>
  <text x="480" y="616" font-size="11" font-weight="bold" fill="#4d7c0f">prepareMessage — Schema.Validate per record</text>
  <text x="480" y="630" font-size="9" fill="#64748b">Result cached in s.cachedMsgs[idx]; no re-validate on retry</text>

  <!-- Validate entry point -->
  <rect x="476" y="640" width="340" height="18" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="484" y="653" font-size="10" fill="#166534">schema.Validate(ctx, msg.Value) → (version, err)</text>

  <!-- Success path -->
  <line x1="646" y1="658" x2="646" y2="664" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="476" y="664" width="340" height="18" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="484" y="677" font-size="10" fill="#166534">OK → strip header if external, getSubjectAndDedupKey → nats.Msg</text>

  <line x1="646" y1="682" x2="646" y2="690" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="476" y="690" width="340" height="18" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="484" y="703" font-size="10" fill="#166534">set Schema-Version-Id header + dedup header → cached Msg → publish</text>

  <!-- Non-fatal error path (branch right) -->
  <line x1="816" y1="649" x2="835" y2="649" stroke="#d97706" stroke-width="1"/>
  <line x1="835" y1="649" x2="835" y2="668" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="843" y="660" width="240" height="28" rx="3" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="851" y="673" font-size="9" fill="#92400e">non-fatal: parse err / msg too short</text>
  <text x="851" y="684" font-size="9" fill="#92400e">→ pushMsgToDLQ inline, mark completed[idx]=true</text>

  <!-- Fatal error path (branch right, lower) -->
  <line x1="816" y1="649" x2="845" y2="649" stroke="#ef4444" stroke-width="1"/>
  <line x1="845" y1="649" x2="845" y2="700" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="843" y="700" width="240" height="28" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="851" y="713" font-size="9" fill="#991b1b">fatal: incompatible / schema not found</text>
  <text x="851" y="724" font-size="9" fill="#991b1b">→ signalPublisher.SendSignal, set savedErr</text>

  <!-- ============================================================ -->

  <line x1="646" y1="730" x2="646" y2="746" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Future classification detail -->
  <rect x="460" y="746" width="372" height="100" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="766" font-size="11" font-weight="bold" fill="#475569">classifyFutures (per pending publish)</text>

  <rect x="476" y="778" width="340" height="18" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="484" y="791" font-size="10" fill="#166534">future.Ok() → mark completed[idx] = true</text>

  <rect x="476" y="800" width="340" height="18" rx="3" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="484" y="813" font-size="10" fill="#92400e">IsBackpressureErr(err) → append to backpressure[] (retry)</text>

  <rect x="476" y="822" width="340" height="18" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="484" y="835" font-size="10" fill="#991b1b">any other err → append to dlqOnExit[] (fatal)</text>

  <!-- Termination arrows -->
  <line x1="646" y1="846" x2="646" y2="872" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- cleanupAndReturn -->
  <rect x="468" y="874" width="356" height="52" rx="6" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
  <text x="568" y="894" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">cleanupAndReturn</text>
  <text x="568" y="910" text-anchor="middle" font-size="10" fill="#475569">DLQ dlqOnExit. On ctx cancel: skip backpressure carry.</text>
  <text x="568" y="922" text-anchor="middle" font-size="10" fill="#64748b">On fatal err: DLQ backpressure carry too.</text>

  <line x1="500" y1="926" x2="500" y2="956" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="646" y1="926" x2="646" y2="956" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- NATS output -->
  <rect x="468" y="958" width="200" height="48" rx="6" fill="#fff" stroke="#059669" stroke-width="1.5"/>
  <text x="568" y="978" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">NATS JetStream</text>
  <text x="568" y="994" text-anchor="middle" font-size="10" fill="#64748b">&lt;prefix&gt;.&lt;podIndex&gt;</text>

  <!-- DLQ output -->
  <rect x="708" y="958" width="200" height="48" rx="6" fill="#fff" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="808" y="978" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">DLQ Subject</text>
  <text x="808" y="994" text-anchor="middle" font-size="10" fill="#64748b">gfm-&lt;hash&gt;-DLQ.failed</text>

  <line x1="646" y1="956" x2="808" y2="958" stroke="#ef4444" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>

  <!-- Backpressure retry loop arc -->
  <path d="M 830 480 Q 880 480 880 560 Q 880 460 830 460" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-dash)"/>
  <text x="895" y="564" font-size="9" fill="#7c3aed" transform="rotate(90, 895, 564)">backoff 50ms→5s</text>

  <!-- Metric annotations -->
  <rect x="708" y="74" width="200" height="56" rx="6" fill="#fff" stroke="#f97316" stroke-width="1"/>
  <text x="808" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">OTel Metrics</text>
  <text x="808" y="110" text-anchor="middle" font-size="9" fill="#64748b">· gf_ingestor_backpressure_active</text>
  <text x="808" y="122" text-anchor="middle" font-size="9" fill="#64748b">· gf_ingestor_backpressure_events_total</text>

  <line x1="646" y1="270" x2="708" y2="106" stroke="#f97316" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

  <!-- Fatal error path from schema validation to cleanupAndReturn -->
  <path d="M 963 728 L 963 790 L 646 790 L 646 870" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="975" y="780" font-size="9" fill="#b91c1c">fatal → batch fails</text>

</g>
</svg>
