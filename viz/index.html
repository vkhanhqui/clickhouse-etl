<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlassFlow — Interactive Module Visualizer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #7d8590;
  --c-source: #388bfd;
  --c-infra: #bc8cff;
  --c-process: #3fb950;
  --c-storage: #d29922;
  --c-error: #f85149;
  --c-entry: #58a6ff;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 14px;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 200;
}
.logo { font-size: 16px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; }
.logo em { color: var(--c-source); font-style: normal; }
.divider { width: 1px; height: 20px; background: var(--border); }
.tabs { display: flex; gap: 3px; background: var(--bg); padding: 3px; border-radius: 8px; }
.tab {
  padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  color: var(--muted); border: none; background: transparent; transition: all .15s;
  white-space: nowrap;
}
.tab.active { background: var(--surface2); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.tab:hover:not(.active) { color: var(--text); }
.actions { display: flex; gap: 8px; margin-left: auto; align-items: center; }
.btn {
  padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; transition: all .15s;
}
.btn:hover { background: var(--surface2); color: var(--text); }
.hint { font-size: 11px; color: var(--muted); }

/* ── Main ── */
.main { flex: 1; display: flex; overflow: hidden; }

/* ── Canvas ── */
.canvas {
  flex: 1; position: relative; overflow: hidden;
  background: var(--bg);
  background-image:
    radial-gradient(circle, #30363d 1px, transparent 1px);
  background-size: 28px 28px;
}
.canvas-svg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 1; overflow: visible;
}

/* ── Node ── */
.node {
  position: absolute; cursor: grab; user-select: none; z-index: 10;
  border-radius: 12px; border: 1.5px solid var(--border);
  background: var(--surface); min-width: 148px;
  transition: box-shadow .15s, border-color .15s, transform .05s;
  padding: 12px 14px 10px;
}
.node:hover { box-shadow: 0 4px 24px rgba(0,0,0,.5); border-color: #484f58; }
.node.selected { border-color: var(--c-source); box-shadow: 0 0 0 3px rgba(56,139,253,.18), 0 4px 24px rgba(0,0,0,.5); }
.node.dragging { cursor: grabbing; z-index: 100; box-shadow: 0 12px 40px rgba(0,0,0,.7); transform: scale(1.03); }
.node-icon { font-size: 22px; line-height: 1; margin-bottom: 5px; }
.node-name { font-weight: 600; font-size: 13px; line-height: 1.2; }
.node-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.node-tag {
  display: inline-block; padding: 2px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 600; margin-top: 7px; letter-spacing: .02em;
}

.cat-source  { border-color: rgba(56,139,253,.35); }
.cat-source  .node-tag { background: rgba(56,139,253,.15); color: #79c0ff; }
.cat-infra   { border-color: rgba(188,140,255,.35); }
.cat-infra   .node-tag { background: rgba(188,140,255,.15); color: #d2a8ff; }
.cat-process { border-color: rgba(63,185,80,.35); }
.cat-process .node-tag { background: rgba(63,185,80,.15); color: #56d364; }
.cat-storage { border-color: rgba(210,153,34,.35); }
.cat-storage .node-tag { background: rgba(210,153,34,.15); color: #e3b341; }
.cat-error   { border-color: rgba(248,81,73,.35); }
.cat-error   .node-tag { background: rgba(248,81,73,.15); color: #ff7b72; }
.cat-entry   { border-color: rgba(88,166,255,.5); }
.cat-entry   .node-tag { background: rgba(88,166,255,.15); color: #79c0ff; }

/* ── Detail Panel ── */
.detail {
  width: 300px; flex-shrink: 0; background: var(--surface);
  border-left: 1px solid var(--border); overflow-y: auto;
  transform: translateX(100%); transition: transform .2s ease;
  display: flex; flex-direction: column; z-index: 50;
}
.detail.open { transform: translateX(0); }
.detail-head {
  padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 10px; flex-shrink: 0;
}
.detail-icon { font-size: 28px; line-height: 1; }
.detail-title { font-weight: 700; font-size: 15px; }
.detail-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.close-btn {
  margin-left: auto; background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 18px; line-height: 1; padding: 0; flex-shrink: 0;
  transition: color .15s;
}
.close-btn:hover { color: var(--text); }
.detail-body { padding: 14px 16px; flex: 1; }
.section { margin-bottom: 16px; }
.section-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin-bottom: 7px; font-weight: 600;
}
.section-text { font-size: 12.5px; color: #adbac7; line-height: 1.65; }
.tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  padding: 3px 8px; border-radius: 4px; font-size: 11px;
  background: var(--surface2); border: 1px solid var(--border); color: #adbac7;
}
.file-item {
  font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px;
  color: #79c0ff; padding: 4px 0; border-bottom: 1px solid var(--border);
  line-height: 1.4;
}
.file-item:last-child { border-bottom: none; }

/* ── Legend ── */
.legend {
  position: absolute; bottom: 14px; left: 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 13px;
  font-size: 11px; z-index: 50;
}
.legend-title { font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; font-size: 10px; }
.legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.legend-row:last-child { margin-bottom: 0; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

/* ── Connection labels (SVG text) ── */
.conn-label { font-size: 10px; fill: #7d8590; font-family: -apple-system, sans-serif; }
</style>
</head>

    <div class="detail-body">

  </div>
</div>

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════

let currentView = 'flow';
let positions = {};       // { viewId: { nodeId: {x, y} } }
let origPositions = {};   // original defaults
let drag = null;          // { nodeId, startX, startY, origX, origY }
let selectedNode = null;

// ════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════

function init() {
  // Save original positions
  for (const [viewId, view] of Object.entries(VIEWS)) {
    origPositions[viewId] = {};
    positions[viewId] = {};
    for (const n of view.nodes) {
      origPositions[viewId][n.id] = { x: n.x, y: n.y };
      positions[viewId][n.id] = { x: n.x, y: n.y };
    }
  }
  renderView('flow');
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
}

// ════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════

function renderView(viewId) {
  currentView = viewId;
  // Update tabs
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && viewId === 'flow') || (i === 1 && viewId === 'modules'));
  });
  // Clear canvas nodes
  document.querySelectorAll('.node').forEach(n => n.remove());
  // Create nodes
  const view = VIEWS[viewId];
  const canvas = document.getElementById('canvas');
  for (const n of view.nodes) {
    const el = document.createElement('div');
    el.className = `node cat-${n.cat}`;
    el.id = `node-${n.id}`;
    el.style.left = positions[viewId][n.id].x + 'px';
    el.style.top  = positions[viewId][n.id].y + 'px';
    if (n.w) el.style.minWidth = n.w + 'px';
    el.innerHTML = `
      <div class="node-icon">${n.icon}</div>
      <div class="node-name">${n.name}</div>
      <div class="node-sub">${n.sub}</div>
      <div class="node-tag">${n.tag}</div>`;
    el.addEventListener('mousedown', e => startDrag(e, n.id));
    el.addEventListener('click', e => { if (!drag) showDetail(n.id); });
    canvas.appendChild(el);
  }
  // Legend
  const legend = document.getElementById('legend');
  legend.innerHTML = `<div class="legend-title">Legend</div>` +
    view.legend.map(l =>
      `<div class="legend-row"><div class="legend-dot" style="background:${l.color}"></div><span>${l.label}</span></div>`
    ).join('');
  // Draw connections
  closeDetail();
  drawConnections();
}

// ════════════════════════════════════════════════
//  SVG CONNECTIONS
// ════════════════════════════════════════════════

function drawConnections() {
  const svg = document.getElementById('svg');
  // Remove old paths and texts (keep defs and markers)
  svg.querySelectorAll('path, text, circle').forEach(el => el.remove());

  const view = VIEWS[currentView];
  const canvas = document.getElementById('canvas');
  const cr = canvas.getBoundingClientRect();

  for (const conn of view.connections) {
    const fromEl = document.getElementById(`node-${conn.from}`);
    const toEl   = document.getElementById(`node-${conn.to}`);
    if (!fromEl || !toEl) continue;

    const { sx, sy, tx, ty, cpx1, cpy1, cpx2, cpy2 } = getConnectionPoints(fromEl, toEl, cr);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const d = `M ${sx} ${sy} C ${cpx1} ${cpy1}, ${cpx2} ${cpy2}, ${tx} ${ty}`;
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', conn.color || '#484f58');
    path.setAttribute('stroke-width', '1.8');
    if (conn.dash) path.setAttribute('stroke-dasharray', conn.dash);
    path.setAttribute('marker-end', `url(#${conn.marker || 'arr'})`);
    path.setAttribute('opacity', '0.75');
    svg.appendChild(path);

    // Optional label
    if (conn.label) {
      const mx = (sx + tx) / 2;
      const my = (sy + ty) / 2 - 5;
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', mx);
      txt.setAttribute('y', my);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('class', 'conn-label');
      txt.textContent = conn.label;
      svg.appendChild(txt);
    }
  }
}

function getConnectionPoints(fromEl, toEl, cr) {
  const fRect = fromEl.getBoundingClientRect();
  const tRect = toEl.getBoundingClientRect();

  const fx = fRect.left - cr.left; const fw = fRect.width;  const fh = fRect.height;
  const fy = fRect.top  - cr.top;
  const tx = tRect.left - cr.left; const tw = tRect.width;  const th = tRect.height;
  const ty = tRect.top  - cr.top;

  const fcx = fx + fw/2; const fcy = fy + fh/2;
  const tcx = tx + tw/2; const tcy = ty + th/2;

  const dx = tcx - fcx;
  const dy = tcy - fcy;

  let sx, sy, ex, ey;

  if (Math.abs(dx) >= Math.abs(dy)) {
    // horizontal dominant
    if (dx >= 0) { sx = fx + fw; sy = fcy; ex = tx;      ey = tcy; }
    else          { sx = fx;      sy = fcy; ex = tx + tw; ey = tcy; }
  } else {
    // vertical dominant
    if (dy >= 0) { sx = fcx; sy = fy + fh; ex = tcx; ey = ty;      }
    else          { sx = fcx; sy = fy;      ex = tcx; ey = ty + th; }
  }

  // Bezier control points
  const ddx = ex - sx; const ddy = ey - sy;
  let cpx1, cpy1, cpx2, cpy2;
  if (Math.abs(ddx) >= Math.abs(ddy)) {
    cpx1 = sx + ddx * 0.5; cpy1 = sy;
    cpx2 = ex - ddx * 0.5; cpy2 = ey;
  } else {
    cpx1 = sx;              cpy1 = sy + ddy * 0.5;
    cpx2 = ex;              cpy2 = ey - ddy * 0.5;
  }

  return { sx, sy, tx: ex, ty: ey, cpx1, cpy1, cpx2, cpy2 };
}

// ════════════════════════════════════════════════
//  DRAG
// ════════════════════════════════════════════════

function startDrag(e, nodeId) {
  e.preventDefault();
  const el = document.getElementById(`node-${nodeId}`);
  const canvas = document.getElementById('canvas');
  const cr = canvas.getBoundingClientRect();
  drag = {
    nodeId,
    startX: e.clientX,
    startY: e.clientY,
    origX: positions[currentView][nodeId].x,
    origY: positions[currentView][nodeId].y,
    moved: false,
  };
  el.classList.add('dragging');
}

function onMouseMove(e) {
  if (!drag) return;
  const dx = e.clientX - drag.startX;
  const dy = e.clientY - drag.startY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) drag.moved = true;
  const nx = Math.max(0, drag.origX + dx);
  const ny = Math.max(0, drag.origY + dy);
  positions[currentView][drag.nodeId] = { x: nx, y: ny };
  const el = document.getElementById(`node-${drag.nodeId}`);
  el.style.left = nx + 'px';
  el.style.top  = ny + 'px';
  drawConnections();
}

function onMouseUp(e) {
  if (!drag) return;
  const el = document.getElementById(`node-${drag.nodeId}`);
  el.classList.remove('dragging');
  if (!drag.moved) {
    // treat as click — showDetail is handled by the click listener
  }
  drag = null;
}

// ════════════════════════════════════════════════
//  DETAIL PANEL
// ════════════════════════════════════════════════

function showDetail(nodeId) {
  const view = VIEWS[currentView];
  const n = view.nodes.find(x => x.id === nodeId);
  if (!n) return;

  if (selectedNode) document.getElementById(`node-${selectedNode}`)?.classList.remove('selected');
  selectedNode = nodeId;
  document.getElementById(`node-${nodeId}`).classList.add('selected');

  document.getElementById('d-icon').textContent  = n.icon;
  document.getElementById('d-title').textContent = n.name;
  document.getElementById('d-sub').textContent   = n.sub;
  document.getElementById('d-desc').textContent  = n.desc;

  const techEl = document.getElementById('d-tech');
  techEl.innerHTML = (n.tech || []).map(t => `<span class="chip">${t}</span>`).join('');
  document.getElementById('d-tech-section').style.display = n.tech?.length ? '' : 'none';

  const filesEl = document.getElementById('d-files');
  filesEl.innerHTML = (n.files || []).map(f => `<div class="file-item">${f}</div>`).join('');
  document.getElementById('d-files-section').style.display = n.files?.length ? '' : 'none';

  // Connections (outgoing)
  const conns = view.connections.filter(c => c.from === nodeId);
  const connNames = conns.map(c => {
    const target = view.nodes.find(x => x.id === c.to);
    return target ? `<span class="chip">${target.name}</span>` : '';
  }).join('');
  document.getElementById('d-deps').innerHTML = connNames;
  document.getElementById('d-deps-section').style.display = conns.length ? '' : 'none';

  document.getElementById('detail').classList.add('open');
}

function closeDetail() {
  if (selectedNode) document.getElementById(`node-${selectedNode}`)?.classList.remove('selected');
  selectedNode = null;
  document.getElementById('detail').classList.remove('open');
}

// ════════════════════════════════════════════════
//  CONTROLS
// ════════════════════════════════════════════════

function switchView(viewId) {
  closeDetail();
  // Reset positions for new view to defaults each switch (optional: comment out to persist)
  renderView(viewId);
}

function resetLayout() {
  for (const nodeId of Object.keys(positions[currentView])) {
    positions[currentView][nodeId] = { ...origPositions[currentView][nodeId] };
  }
  renderView(currentView);
}

// Redraw on window resize
window.addEventListener('resize', drawConnections);

init();
