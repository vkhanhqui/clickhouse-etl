<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1360" font-family="Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22c55e"/>
    </marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="layer1-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="layer2-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="ingestor-box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1600" fill="url(#bg-grad)"/>
  <rect x="0" y="0" width="1200" height="1600" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold">Dedup Architecture — Two-Layer Design</text>
  <text x="600" y="60" text-anchor="middle" fill="#94a3b8" font-size="11">NATS JetStream Server-Side + BadgerDB Application-Level Dedup</text>

  <!-- ============================== -->
  <!-- KAFKA / INGESTOR SECTION       -->
  <!-- ============================== -->
  <text x="40" y="98" fill="#f8fafc" font-size="12" font-weight="bold">SOURCE</text>
  <line x1="40" y1="105" x2="1160" y2="105" stroke="#334155" stroke-width="1"/>

  <!-- Kafka Topic -->
  <rect x="60" y="120" width="200" height="64" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="160" y="146" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="bold">KAFKA TOPIC</text>
  <text x="160" y="163" text-anchor="middle" fill="#94a3b8" font-size="10">Messages: {order_id: "abc"}</text>

  <!-- Duplicate records label -->
  <rect x="60" y="196" width="200" height="28" rx="4" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="160" y="213" text-anchor="middle" fill="#ef4444" font-size="10">2× same order_id in same batch</text>

  <!-- Arrow Kafka → Ingestor -->
  <line x1="260" y1="152" x2="320" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ingestor -->
  <rect x="330" y="110" width="280" height="84" rx="8" fill="url(#ingestor-box)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="470" y="132" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">INGESTOR</text>
  <text x="470" y="150" text-anchor="middle" fill="#94a3b8" font-size="10">KafkaMsgProcessor.ProcessBatch()</text>
  <text x="470" y="168" text-anchor="middle" fill="#64748b" font-size="10">1. Extract dedup field from schema</text>
  <text x="470" y="183" text-anchor="middle" fill="#64748b" font-size="10">2. Set Nats-Msg-Id header</text>

  <!-- Arrow Ingestor → NATS -->
  <line x1="610" y1="152" x2="670" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- NATS Publish label -->
  <text x="700" y="145" fill="#94a3b8" font-size="10">PublishMsg → NATS</text>
  <text x="700" y="160" fill="#64748b" font-size="9">Nats-Msg-Id: "abc"</text>

  <!-- ============================== -->
  <!-- LAYER 1: NATS SERVER DEDUP     -->
  <!-- ============================== -->
  <text x="40" y="250" fill="#f8fafc" font-size="12" font-weight="bold">LAYER 1 — NATS JETSTREAM SERVER DEDUP</text>
  <line x1="40" y1="257" x2="1160" y2="257" stroke="#334155" stroke-width="1"/>

  <!-- Layer 1 header badge -->
  <rect x="42" y="268" width="130" height="22" rx="11" fill="url(#layer1-head)"/>
  <text x="107" y="283" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">NATS Server</text>

  <rect x="60" y="300" width="1080" height="320" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- Stream Config -->
  <rect x="100" y="320" width="300" height="80" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="250" y="340" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="bold">StreamConfig</text>
  <text x="110" y="358" fill="#94a3b8" font-size="10">Name:   "pipeline-ingestor"</text>
  <text x="110" y="374" fill="#94a3b8" font-size="10">Subjects: ["input.subject"]</text>
  <text x="110" y="390" fill="#fbbf24" font-size="10">Duplicates: dedupWindow (default 2m)</text>

  <!-- Arrow into decision -->
  <line x1="400" y1="360" x2="460" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="560,320 640,360 560,400 480,360" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="560" y="356" text-anchor="middle" fill="#fcd34d" font-size="10">Nats-Msg-Id</text>
  <text x="560" y="370" text-anchor="middle" fill="#fcd34d" font-size="10">seen before?</text>

  <!-- NO branch (green) -->
  <line x1="640" y1="360" x2="720" y2="360" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="680" y="352" text-anchor="middle" fill="#22c55e" font-size="10">NO</text>

  <rect x="730" y="325" width="200" height="70" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
  <text x="830" y="347" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold">STORE MESSAGE</text>
  <text x="830" y="365" text-anchor="middle" fill="#94a3b8" font-size="10">New seq assigned</text>
  <text x="830" y="381" text-anchor="middle" fill="#94a3b8" font-size="10">Msg stored in stream</text>
  <text x="830" y="397" text-anchor="middle" fill="#64748b" font-size="9">→ consumer will see it</text>

  <!-- YES branch (red) -->
  <line x1="480" y1="360" x2="420" y2="440" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="455" y="400" text-anchor="end" fill="#ef4444" font-size="10">YES (within DuplicateWindow)</text>

  <rect x="260" y="445" width="240" height="70" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="380" y="467" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">DROP SILENTLY</text>
  <text x="380" y="485" text-anchor="middle" fill="#94a3b8" font-size="10">Return original seq</text>
  <text x="380" y="501" text-anchor="middle" fill="#64748b" font-size="9">→ consumer never sees it</text>

  <!-- Example flow -->
  <rect x="60" y="540" width="1060" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="80" y="558" fill="#f8fafc" font-size="11" font-weight="bold">Example:</text>
  <text x="80" y="576" fill="#94a3b8" font-size="10">Publish "abc" → seq=1, stored</text>
  <text x="80" y="592" fill="#ef4444" font-size="10">Publish "abc" again (within 2m) → server returns seq=1, NOT stored</text>
  <text x="520" y="576" fill="#22c55e" font-size="10">✅</text>
  <text x="520" y="592" fill="#22c55e" font-size="10">✅</text>

  <!-- ============================== -->
  <!-- STREAMING COMPONENT            -->
  <!-- ============================== -->
  <text x="40" y="670" fill="#f8fafc" font-size="12" font-weight="bold">CONSUMER — STREAMING COMPONENT</text>
  <line x1="40" y1="677" x2="1160" y2="677" stroke="#334155" stroke-width="1"/>

  <!-- Arrow from Layer 1 to consumer -->
  <line x1="600" y1="620" x2="600" y2="700" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Streaming Component -->
  <rect x="100" y="710" width="1000" height="130" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- NATS Consumer -->
  <rect x="130" y="730" width="200" height="50" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
  <text x="230" y="751" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">NATS Consumer</text>
  <text x="230" y="767" text-anchor="middle" fill="#94a3b8" font-size="9">Consumer.Fetch()</text>

  <line x1="330" y1="755" x2="380" y2="755" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Buffer -->
  <rect x="390" y="730" width="180" height="50" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="480" y="751" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="bold">Buffer</text>
  <text x="480" y="767" text-anchor="middle" fill="#94a3b8" font-size="9">maxBatchSize: 50000</text>

  <line x1="570" y1="755" x2="620" y2="755" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- flush label -->
  <rect x="630" y="740" width="100" height="30" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="680" y="759" text-anchor="middle" fill="#fcd34d" font-size="10">flushBuffer()</text>

  <line x1="730" y1="755" x2="780" y2="755" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ProcessBatch -->
  <rect x="790" y="730" width="280" height="50" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="930" y="751" text-anchor="middle" fill="#86efac" font-size="10" font-weight="bold">ProcessBatch</text>
  <text x="930" y="767" text-anchor="middle" fill="#94a3b8" font-size="9">runProcessors() chain</text>

  <!-- Ticker note -->
  <text x="130" y="810" fill="#64748b" font-size="9">flush ticker: 100ms interval — buffer flush on capacity or ticker expiry</text>
  <text x="130" y="825" fill="#64748b" font-size="9">buffer copy under lock → reset → ProcessBatch(copied)</text>

  <!-- ============================== -->
  <!-- LAYER 2: BADGERDB DEDUP        -->
  <!-- ============================== -->
  <text x="40" y="895" fill="#f8fafc" font-size="12" font-weight="bold">LAYER 2 — BADGERDB APPLICATION DEDUP</text>
  <line x1="40" y1="902" x2="1160" y2="902" stroke="#334155" stroke-width="1"/>

  <!-- Layer 2 header badge -->
  <rect x="42" y="913" width="160" height="22" rx="11" fill="url(#layer2-head)"/>
  <text x="122" y="928" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">DedupProcessor</text>

  <!-- Arrow from ProcessBatch -->
  <line x1="600" y1="840" x2="600" y2="950" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="950" width="1080" height="280" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- FilterDuplicates -->
  <rect x="120" y="975" width="420" height="120" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="330" y="997" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold">FilterDuplicates(ctx, messages)</text>
  <text x="140" y="1018" fill="#94a3b8" font-size="10">BadgerDB .View() — read-only transaction</text>
  <text x="140" y="1036" fill="#94a3b8" font-size="10">for each msg in batch:</text>
  <text x="160" y="1054" fill="#64748b" font-size="10">key = msg.Header["Nats-Msg-Id"]</text>
  <text x="160" y="1072" fill="#64748b" font-size="10">txn.Get(key)</text>
  <text x="160" y="1090" fill="#22c55e" font-size="10">  ErrKeyNotFound → KEEP (first time)</text>
  <text x="160" y="1106" fill="#ef4444" font-size="10">  Found → DROP (duplicate)</text>

  <!-- Arrow Filter → decision -->
  <line x1="540" y1="1035" x2="600" y2="1035" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <polygon points="700,990 770,1035 700,1080 630,1035" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="700" y="1031" text-anchor="middle" fill="#fcd34d" font-size="10">Any msgs</text>
  <text x="700" y="1045" text-anchor="middle" fill="#fcd34d" font-size="10">remain?</text>

  <!-- NO branch -->
  <line x1="630" y1="1035" x2="560" y2="1035" stroke="#f59e0b" stroke-width="1"/>
  <text x="595" y="1028" text-anchor="middle" fill="#f59e0b" font-size="10">NO</text>

  <rect x="450" y="1110" width="180" height="40" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="540" y="1134" text-anchor="middle" fill="#fca5a5" font-size="10">No messages → Ack, skip write</text>

  <!-- YES branch -->
  <line x1="770" y1="1035" x2="840" y2="1035" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="805" y="1028" text-anchor="middle" fill="#22c55e" font-size="10">YES</text>

  <!-- Writer -->
  <rect x="850" y="975" width="260" height="70" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="980" y="997" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">Writer.WriteBatch()</text>
  <text x="980" y="1017" text-anchor="middle" fill="#94a3b8" font-size="10">Sink / Join / Next stage</text>
  <text x="980" y="1037" text-anchor="middle" fill="#64748b" font-size="9">Downstream ClickHouse etc.</text>

  <!-- Down arrow from Writer -->
  <line x1="980" y1="1045" x2="980" y2="1120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SaveKeys (deferred CommitFn) -->
  <rect x="850" y="1125" width="260" height="80" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="980" y="1147" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold">SaveKeys (CommitFn)</text>
  <text x="980" y="1167" text-anchor="middle" fill="#94a3b8" font-size="10">BadgerDB .Update() — write txn</text>
  <text x="980" y="1185" text-anchor="middle" fill="#64748b" font-size="10">NewEntry(key).WithTTL(window)</text>
  <text x="980" y="1199" text-anchor="middle" fill="#64748b" font-size="10">Only after successful downstream write</text>

  <!-- Notes -->
  <text x="600" y="1290" text-anchor="middle" fill="#64748b" font-size="9">→ Dedup key is the same (Nats-Msg-Id header, extracted from payload)</text>
  <text x="600" y="1306" text-anchor="middle" fill="#64748b" font-size="9">→ Window config drives BOTH: NATS Duplicates + BadgerDB TTL</text>
  <text x="600" y="1322" text-anchor="middle" fill="#64748b" font-size="9">→ CommitFn is deferred — keys saved ONLY after successful downstream write (at-most-once)</text>
</svg>
