<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" font-family="Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="1600" height="1400" fill="#0f172a"/>
  <rect x="0" y="0" width="1600" height="1400" fill="none" stroke="#1e293b" stroke-width="1"/>

  <text x="800" y="40" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="bold">Processor Chain</text>
  <text x="800" y="60" text-anchor="middle" fill="#64748b" font-size="11">Filter → Dedup (CommitFn) → Transform | DLQ on filter + transform failures</text>

  <!-- ============================== -->
  <!-- STREAMING COMPONENT            -->
  <!-- ============================== -->
  <rect x="100" y="95" width="1400" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="120" y="118" fill="#94a3b8" font-size="10" font-weight="bold">StreamingComponent</text>
  <text x="120" y="138" fill="#64748b" font-size="10">Consumer.Fetch() → Buffer (50k / 100ms) → runProcessors(chain)</text>
  <text x="120" y="158" fill="#475569" font-size="9">collects commits: [nil, SaveKeys, nil] — only Dedup sets non-nil CommitFn</text>

  <!-- arrow down -->
  <line x1="800" y1="175" x2="800" y2="215" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============================== -->
  <!-- PROCESSOR CHAIN                -->
  <!-- ============================== -->
  <!-- column headers -->
  <rect x="100" y="225" width="440" height="30" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="320" y="245" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="bold">1. FilterProcessor</text>

  <rect x="580" y="225" width="440" height="30" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="800" y="245" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="bold">2. DedupProcessor</text>

  <rect x="1060" y="225" width="440" height="30" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1280" y="245" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="bold">3. StatelessTransformer</text>

  <!-- arrows between -->
  <line x1="540" y1="240" x2="580" y2="240" stroke="#334155" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1020" y1="240" x2="1060" y2="240" stroke="#334155" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ======================= -->
  <!-- FILTER                  -->
  <!-- ======================= -->
  <rect x="100" y="270" width="440" height="310" rx="4" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="120" y="295" fill="#64748b" font-size="10">wrapped in DLQMiddleware</text>

  <rect x="120" y="310" width="400" height="115" rx="4" fill="#1e293b" stroke="none"/>
  <text x="140" y="330" fill="#94a3b8" font-size="10">for each msg: filter.Matches(payload)</text>
  <text x="160" y="352" fill="#22c55e" font-size="10">true  → keep</text>
  <text x="160" y="370" fill="#64748b" font-size="10">false → drop</text>
  <text x="160" y="388" fill="#ef4444" font-size="10">error → FailedMessage → DLQ</text>
  <text x="140" y="412" fill="#64748b" font-size="10">CommitFn: nil (stateless)</text>

  <rect x="120" y="440" width="400" height="55" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="140" y="458" fill="#64748b" font-size="9">DLQMiddleware: intercepts FailedMessages, writes to</text>
  <text x="140" y="474" fill="#64748b" font-size="9">DLQ subject, clears them. FatalError propagates as-is.</text>

  <text x="120" y="520" fill="#475569" font-size="9">Metrics: processor_messages{success|filtered|error}</text>

  <!-- ======================= -->
  <!-- DEDUP                   -->
  <!-- ======================= -->
  <rect x="580" y="270" width="440" height="310" rx="4" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="600" y="295" fill="#64748b" font-size="10">no DLQ wrapper (no per-msg failures)</text>

  <rect x="600" y="310" width="400" height="130" rx="4" fill="#1e293b" stroke="none"/>
  <text x="620" y="330" fill="#94a3b8" font-size="10">FilterDuplicates(ctx, messages)</text>
  <text x="640" y="352" fill="#64748b" font-size="10">BadgerDB .View() read txn</text>
  <text x="640" y="370" fill="#64748b" font-size="10">for each: txn.Get(Nats-Msg-Id)</text>
  <text x="660" y="392" fill="#22c55e" font-size="10">ErrKeyNotFound → KEEP</text>
  <text x="660" y="410" fill="#64748b" font-size="10">Found → DROP (duplicate)</text>
  <text x="620" y="432" fill="#64748b" font-size="10">FatalError on Badger failure → chain abort</text>

  <rect x="600" y="450" width="400" height="65" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="620" y="468" fill="#94a3b8" font-size="10">Deferred CommitFn (after write):</text>
  <text x="640" y="486" fill="#64748b" font-size="10">dp.dedup.SaveKeys(ctx, deduplicatedMessages)</text>
  <text x="640" y="502" fill="#64748b" font-size="10">BadgerDB .Update() write txn</text>

  <text x="600" y="540" fill="#475569" font-size="9">Metrics: processor_messages{duplicate|success}, processing_duration</text>

  <!-- ======================= -->
  <!-- TRANSFORM                -->
  <!-- ======================= -->
  <rect x="1060" y="270" width="440" height="310" rx="4" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="1080" y="295" fill="#64748b" font-size="10">wrapped in DLQMiddleware</text>

  <rect x="1080" y="310" width="400" height="130" rx="4" fill="#1e293b" stroke="none"/>
  <text x="1100" y="330" fill="#94a3b8" font-size="10">for each msg: transformer.Transform(ctx, msg)</text>
  <text x="1120" y="352" fill="#22c55e" font-size="10">success → replace msg</text>
  <text x="1120" y="370" fill="#ef4444" font-size="10">other err → FailedMessage → DLQ</text>
  <text x="1140" y="388" fill="#64748b" font-size="10">(schema_error / error status)</text>
  <text x="1120" y="408" fill="#ef4444" font-size="10">ErrSignalSent → FatalError (component restart)</text>
  <text x="1100" y="432" fill="#64748b" font-size="10">CommitFn: nil (stateless)</text>

  <rect x="1080" y="450" width="400" height="55" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="1100" y="468" fill="#64748b" font-size="9">DLQMiddleware: intercepts FailedMessages, writes to</text>
  <text x="1100" y="484" fill="#64748b" font-size="9">DLQ subject, clears them. DLQ reason: DedupOverflow.</text>

  <text x="1080" y="540" fill="#475569" font-size="9">Metrics: processor_messages{success|error|schema_error}</text>

  <!-- ============================== -->
  <!-- POST-PROCESS                   -->
  <!-- ============================== -->
  <line x1="320" y1="580" x2="320" y2="630" stroke="#334155" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="800" y1="580" x2="800" y2="630" stroke="#334155" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1280" y1="580" x2="1280" y2="630" stroke="#334155" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="100" y="640" width="1400" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="120" y="662" fill="#94a3b8" font-size="10" font-weight="bold">Writer.WriteBatch(messages)</text>
  <text x="120" y="682" fill="#64748b" font-size="10">Writes to NATS output subject. On backpressure → retry with exp backoff. On hard err → DLQ unrecoverable.</text>

  <line x1="800" y1="700" x2="800" y2="740" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="750" width="1000" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="800" y="772" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="bold">Execute CommitFns (only Dedup's SaveKeys is non-nil)</text>
  <text x="800" y="792" text-anchor="middle" fill="#64748b" font-size="10">for i, commit := range commits { commit() } — SaveKeys persists dedup keys to BadgerDB</text>

  <line x1="800" y1="810" x2="800" y2="850" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="500" y="860" width="600" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="800" y="885" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">reader.Ack(batch) — batch acknowledged, processing complete</text>

  <!-- ============================== -->
  <!-- DLQ                             -->
  <!-- ============================== -->
  <line x1="100" y1="470" x2="60" y2="470" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="60" y1="470" x2="60" y2="950" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1500" y1="480" x2="1540" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1540" y1="480" x2="1540" y2="950" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="30" y="955" width="1540" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="800" y="977" text-anchor="middle" fill="#64748b" font-size="10">DLQ subject: pipelineID_DLQ — FailedMessages from Filter and Transform routed here</text>

  <!-- bottom notes -->
  <text x="100" y="1030" fill="#475569" font-size="9">On FatalError (from any processor): batch is NAKed, messages redelivered | On ErrSignalSent: component shuts down cleanly</text>
  <text x="100" y="1048" fill="#475569" font-size="9">On write failure: backpressure → exponential backoff + InProgress() keepalive (StreamingComponent) | hard err → DLQ unrecoverable</text>
</svg>
